<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>

<body>
    <section class="container-fluid">
        <div class="container">
            <div class="row">
                <nav class="navbar sm:navbar-expand bg-primary fg-white">
                    <div class="container-fluid">
                        <img src="./aessest/tragleam.png" />
                        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                            data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon" aria-hidden="true"></span>
                        </button>
                        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                            aria-labelledby="navbarNavAltMarkupLabel">
                            <div class="drawer-header">
                                <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="drawer"
                                    aria-label="Close"></button>
                            </div>
                            <div class="drawer-body d-flex justify-content-center align-items-center">
                                <div class="nav navbar-nav">
                                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                                    <a class="nav-link active" href="#">Shop</a>
                                    <a class="nav-link active" href="#">Spa</a>
                                    <a class="nav-link active" aria-disabled="true">About</a>
                                    <a class="nav-link active" aria-disabled="true">contact</a>
                                </div>
                            </div>
                            <div class="drawer-body d-flex justify-content-end align-items-center">
                                <div class=" nav navbar-nav align-items-cente bg-black">
                                <i class="ri-user-line fg-white"></i>
                                <i class="ri-heart-3-line fg-white"></i>
                                <i class="ri-shopping-bag-4-line fg-white"></i>
                                </div>

                            </div>

                    </div>
                    </dialog>
            </div>
            </nav>
        </div>
        </div>
    </section>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
